<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMBLE · Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2d2b;--muted:#7a8683;--soft:#f2f5f4;--line:#e6ebe9;--bg:#fafbfa;--pri:#2c5a52;--pri-soft:#e5efec;--amb:#d4923a;--amb-soft:#fbf3e7;--ok:#3f8a5a;--ok-soft:#e8f4ec;--bad:#c0503f;--bad-soft:#fcefed;--y:#e9c46a;--o:#e08a3c}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.hd-in{max-width:900px;margin:0 auto;padding:10px 16px 0}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.word{font-family:Georgia,"Times New Roman",serif;font-size:25px;letter-spacing:.05em;color:#1f3d38}
.hd-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--pri-soft);color:var(--pri)}
.clock.warn{background:var(--amb-soft);color:#9a6420}.clock.over{background:var(--bad-soft);color:var(--bad)}
.link{background:none;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:4px 2px}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);margin-top:6px;position:relative}
.tabs::before{content:"";position:absolute;left:7%;right:7%;top:20px;height:2px;background:var(--line)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 2px 9px;font-size:11.5px;color:var(--muted);cursor:pointer;line-height:1.2;text-align:center;border-bottom:2px solid transparent}
.tabs .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);transition:transform .25s}
.tabs button.cur{color:var(--pri);font-weight:700;border-bottom-color:var(--pri)}
.tabs button.cur .n{border-color:var(--pri);background:var(--pri);color:#fff}
.tabs button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs button.pop .n{transform:scale(1.25)}
.curname{display:none}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 110px}
.seg-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 12px}
.seg-h h2{font-size:21px;font-weight:600;margin:0}.seg-h span{font-size:12px;color:var(--muted)}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ql{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ql em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.row2 .q{margin-bottom:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.o{border:0;background:var(--soft);border-radius:18px;padding:7px 13px;cursor:pointer;font-size:13px;min-height:34px;transition:background .12s,transform .08s}
.o:active{transform:scale(.95)}
.o.on{background:var(--pri);color:#fff}
.o.oth{background:#fff;border:1px dashed #c9d2cf;color:var(--muted)}.o.oth.on{background:var(--pri);border-color:var(--pri);color:#fff}
.o.on.c1{background:var(--ok)}.o.on.c2{background:var(--amb)}.o.on.c3{background:var(--o)}.o.on.c4{background:var(--bad)}
input[type=text],input[type=date],textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;width:100%}
input:focus,textarea:focus{outline:2px solid #2c5a5233;border-color:var(--pri)}
.oth-in{margin-top:8px}textarea{min-height:54px;resize:vertical}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:8px;background:var(--bad-soft);color:var(--bad);font-weight:500}
.tr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft)}
.tr:last-child{border-bottom:0}.tr .nm{font-weight:500}.tr .hw{font-size:11.5px;color:var(--muted)}
/* measurements & score text */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.mf{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff}
.mf label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.mf .hw{font-size:11px;color:var(--muted);margin-top:4px}
.mf .in{display:flex;align-items:center;gap:6px}
.mf input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:15px;font-weight:600}
.mf .u{font-size:12px;color:var(--muted)}
.mf .chg{font-size:11.5px;font-weight:700;margin-top:4px}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.cbox{border-radius:12px;padding:12px;background:var(--soft)}
.cbox .big{font-size:26px;font-weight:700;line-height:1.1}
.cbox .lbl{font-size:12px;color:var(--muted)}
.cbox .cat{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;color:#fff;background:var(--muted)}
.bx{font-size:11.5px;color:var(--muted);margin:3px 0 0}
.legendline{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 10px;margin-bottom:10px}
/* re-assessment */
.mode{display:none;margin-left:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--amb);color:#fff;padding:3px 9px;border-radius:10px;vertical-align:4px}
body.re .mode{display:inline-block}
body.re .hd{border-bottom:2px solid var(--amb)}
.lastv{font-size:11px;color:#9a6420;background:var(--amb-soft);border-radius:8px;padding:1px 7px;margin-left:6px;font-weight:500;white-space:nowrap}
.lastv:empty{display:none}
.prevline{font-size:12px;background:var(--amb-soft);color:#7a4f17;border-radius:8px;padding:6px 9px;margin-bottom:8px}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.jbox.res{border-left-color:var(--ok);background:var(--ok-soft)}
.dl{font-size:11.5px;font-weight:700;margin-left:4px}
.gr-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--soft)}
.gr-row:last-child{border-bottom:0}
@media(max-width:700px){.gr-row{grid-template-columns:1fr}}
/* joint summary boxes */
.jboxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-top:10px}
.jbox{display:block;align-self:start;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--y);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;font-size:13px}
.jbox.s2{border-left-color:var(--o)}.jbox.s3{border-left-color:var(--bad)}
.jb-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.jb-h b{font-size:14px}
.pb{white-space:nowrap;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--soft);color:var(--muted)}
.pb.p1{background:#fdf3d6;color:#7a6212}.pb.p2{background:#fbe3cc;color:#9a4f12}.pb.p3{background:var(--bad);color:#fff}
.jbox table{width:100%;border-collapse:collapse;font-size:12.5px}
.jbox th{font-weight:500;color:var(--muted);font-size:11px;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
.jbox td{padding:5px 4px;border-bottom:1px solid var(--soft)}
.jbox tr:last-child td{border-bottom:0}.jbox td:first-child,.jbox td:last-child{white-space:nowrap}
.jbox .ok{color:var(--muted);font-size:12px}
.jbox .jn{margin-top:6px;font-size:12px;color:var(--ink);background:var(--soft);border-radius:8px;padding:5px 8px}
.jbox .ed{font-size:11px;color:var(--pri);margin-top:6px;font-weight:600}
.r1t{color:#8a6d16;font-weight:600}.r2t{color:#a3581c;font-weight:600}.r3t{color:var(--bad);font-weight:600}
/* joint list */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.jg{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 8px;background:#fff}
.jg span{font-weight:600;font-size:13px}.jgn{display:flex;align-items:center;gap:10px}.jibg{background:#f6f9f8;border-radius:10px;padding:3px;display:flex}.ji{flex:none;vertical-align:middle}.jb-h b,.jc-h h4{display:flex;align-items:center;gap:8px}
.jg .sides{display:flex;gap:4px}
.side{white-space:nowrap;border:0;background:var(--soft);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;min-width:58px;transition:all .15s}
.side:active{transform:scale(.95)}
.side.s1{background:#fdf3d6;color:#7a6212}.side.s2{background:#fbe3cc;color:#9a4f12}.side.s3{background:var(--bad);color:#fff}
.side.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.side .dotc{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9fc1b8;margin-right:5px;vertical-align:1px}
.side.s1 .dotc{background:var(--y)}.side.s2 .dotc{background:var(--o)}.side.s3 .dotc{background:#fff}
.fwhere{background:var(--soft);border-radius:10px;padding:10px;margin:0 0 8px}.fwhere .o{background:#fff}.fwhere .o.on{background:var(--pri)}
.qnote{margin-top:8px;font-size:12.5px;padding:7px 10px!important}
/* body map */
.map{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.body svg{width:100%;height:auto;display:block}
.dot{cursor:pointer}
.dot .ring{fill:#fff;stroke:#9fc1b8;stroke-width:2.5;transition:all .2s}
.dot .core{fill:#9fc1b8;transition:fill .2s}
.dot:hover .ring{stroke:var(--pri)}
.dot.s1 .core{fill:var(--y)}.dot.s1 .ring{stroke:var(--y)}
.dot.s2 .core{fill:var(--o)}.dot.s2 .ring{stroke:var(--o)}
.dot.s3 .core{fill:var(--bad)}.dot.s3 .ring{stroke:var(--bad)}
.dot.cur .ring{stroke:var(--pri);stroke-width:4}
.dot.cur .halo{opacity:1;animation:pulse 1.4s infinite}
.halo{fill:none;stroke:var(--pri);stroke-width:2;opacity:0}
@keyframes pulse{0%{r:13;opacity:.7}100%{r:24;opacity:0}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.hint-box{border:1.5px dashed #cfdcd8;border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.hint-box b{display:block;color:var(--ok);font-size:15px;margin-bottom:4px}
.jcard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.jc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.jc-h h4{margin:0;font-size:16px}
.jc-sub{font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 6px;display:flex;justify-content:space-between}
.pscale{display:flex;gap:3px;flex-wrap:wrap}
.pscale button{border:0;width:30px;height:30px;border-radius:8px;background:var(--soft);cursor:pointer;font-size:12.5px;font-weight:600;transition:transform .08s}
.pscale button:active{transform:scale(.9)}
.pscale button.on{color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.tile{position:relative;border:1.5px solid var(--line);border-radius:11px;padding:8px 9px 8px;background:#fff;cursor:pointer;text-align:left;min-height:58px;transition:all .15s;user-select:none}
.tile:active{transform:scale(.97)}
.tile .mv{font-weight:600;font-size:12.5px;display:block;padding-right:30px}
.tile .st{font-size:11px;color:var(--muted)}
.tile.r1{background:#fdf8e8;border-color:var(--y)}.tile.r2{background:#fdf0e4;border-color:var(--o)}.tile.r3{background:var(--bad-soft);border-color:var(--bad)}
.tile.r1 .st{color:#8a6d16}.tile.r2 .st{color:#a3581c}.tile.r3 .st{color:var(--bad)}
.mmt{position:absolute;top:6px;right:6px;border:0;border-radius:7px;background:var(--pri-soft);color:var(--pri);font-size:11px;font-weight:700;padding:3px 6px;cursor:pointer}
.mmt.low{background:var(--amb-soft);color:#9a6420}.mmt.vlow{background:var(--bad-soft);color:var(--bad)}
.jc-f{display:flex;gap:8px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.chips-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sum{border:0;border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;text-align:left;background:var(--amb-soft);color:#7a4f17}
.sum.s3{background:var(--bad-soft);color:var(--bad)}.sum.s1{background:#fdf8e8;color:#7a6212}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.gh{background:#fff;color:var(--pri);border:1px solid #cfdcd8}.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.txt{background:none;color:var(--muted);padding:6px 4px;font-size:12px}
/* results */
.res{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:160px;height:160px}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v span{font-size:42px;font-weight:700;line-height:1}.ring .v small{font-size:11px;color:var(--muted)}
.bar{margin-bottom:9px}.bar .lb{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.bar .tk{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}.bar .fl{height:100%;background:var(--pri);transition:width .3s}
.band{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#fff}
.focus{margin:0;padding-left:18px}.focus li{margin-bottom:3px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ft{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:20}
.ft-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ft .pg{font-size:12px;color:var(--muted)}
.pbar{height:3px;background:var(--soft)}.pbar div{height:100%;background:var(--ok);width:0;transition:width .3s}
table.h{width:100%;border-collapse:collapse;font-size:12.5px}table.h th,table.h td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}table.h th{color:var(--muted);font-weight:500;font-size:11.5px}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.tag{font-size:10.5px;background:var(--pri-soft);color:var(--pri);padding:2px 6px;border-radius:8px;margin-left:3px}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}.toast.show{opacity:1}
@media(max-width:700px){.row2,.map{grid-template-columns:1fr}.body{max-width:240px;margin:0 auto}.res{grid-template-columns:1fr;justify-items:center}.tr{grid-template-columns:1fr;gap:6px}.tabs .tl{display:none}.tabs .n{width:24px;height:24px}.tabs::before{top:18px}.tabs button{padding:5px 0 6px}.curname{display:block;text-align:center;font-size:12.5px;font-weight:700;color:var(--pri);padding:0 0 8px}.o{padding:6px 11px;font-size:12.5px}}
@media print{.hd,.ft,.toast,.no-print{display:none!important}.wrap{padding:0}.seg{display:block!important}.q,.jcard{break-inside:avoid}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <div class="hd-row"><span><span class="word">amble</span><span style="font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-soft);padding:3px 8px;border-radius:10px;margin-left:8px;vertical-align:4px">Validated core</span><span class="mode" id="modeBadge">Re-assessment</span></span>
    <div class="hd-meta"><span id="pct">0%</span><span class="clock" id="clock">0:00</span><button class="link" id="progBtn" type="button">Progress</button></div></div>
  <nav class="tabs" id="tabs"></nav><div class="curname" id="curname"></div>
</div></header>
<main class="wrap" id="form"></main>
<footer class="ft"><div class="pbar"><div id="pfill"></div></div><div class="ft-in">
  <button class="btn gh" id="prev" type="button">← Back</button><span class="pg" id="pgLabel"></span><button class="btn" id="next" type="button">Next →</button>
</div></footer>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* AMBLE Assessment v4 · self-contained, embeddable
   API: window.Amble.getData() · setData(record) · reset() · score()
   Events: document 'amble:change' / 'amble:saved'; in an iframe also parent.postMessage({source:'amble',type,record},'*')
   Load from host: postMessage({source:'amble-host',type:'load',record},'*') */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const SCHEMA='amble-assessment-combined/1',STORE='amble_comb_draft_v7',HIST='amble_comb_history_v4';

/* ---------- joints ---------- */
const JT={
 neck:{c:1,n:'Neck',mv:['Flexion','Extension','Side flexion R','Side flexion L','Rotation R','Rotation L']},
 uback:{c:1,n:'Upper back',mv:['Flexion','Extension','Rotation R','Rotation L']},
 lback:{c:1,n:'Lower back',mv:['Flexion','Extension','Side flexion R','Side flexion L']},
 shoulder:{n:'Shoulder',mv:['Flexion','Extension','Abduction','Adduction','Internal rotation','External rotation']},
 elbow:{n:'Elbow',mv:['Flexion','Extension','Pronation','Supination']},
 wrist:{n:'Wrist / hand',mv:['Flexion','Extension','Radial deviation','Ulnar deviation','Grip']},
 hip:{n:'Hip',mv:['Flexion','Extension','Abduction','Adduction','Internal rotation','External rotation']},
 knee:{n:'Knee',mv:['Flexion','Extension']},
 ankle:{n:'Ankle / foot',mv:['Dorsiflexion','Plantarflexion','Inversion','Eversion']},
};
// front view: client's RIGHT is on the viewer's LEFT
const DOTS=[['neck','C',150,84],['uback','C',150,128],['lback','C',150,196],
 ['shoulder','R',106,104],['shoulder','L',194,104],['elbow','R',88,172],['elbow','L',212,172],['wrist','R',76,234],['wrist','L',224,234],
 ['hip','R',129,244],['hip','L',171,244],['knee','R',125,334],['knee','L',175,334],['ankle','R',122,424],['ankle','L',178,424]];
const RLAB=['No restriction','Mild','Moderate','Full restriction'];
const MMTS=['5','4','3','2','1','0'];
const sideName=s=>s==='R'?'Right':s==='L'?'Left':'';
const eKey=(j,s)=>j+'|'+s;
const eName=k=>{const[j,s]=k.split('|');return JT[j].n+(s==='C'?'':' ('+sideName(s)+')')};
const L='stroke="#1f3d38" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
const F=`fill="#eef4f2" ${L}`, N=`fill="none" ${L}`;
const HL=(x,y,rx=6,ry)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry||rx}" fill="#fbe6cc"/>`;
const RAYS=(x,y,r=9)=>{const a=[-35,0,35].map(d=>d*Math.PI/180);return a.map(t=>`<path d="M${(x+Math.cos(t)*r).toFixed(1)} ${(y+Math.sin(t)*r).toFixed(1)} l${(Math.cos(t)*3.2).toFixed(1)} ${(Math.sin(t)*3.2).toFixed(1)}" stroke="#d4923a" stroke-width="1.7" stroke-linecap="round"/>`).join('')};
const ICON={
 neck:`${HL(24,22,5.5,5)}<circle cx="24" cy="10" r="6.5" ${F}/><path d="M20.5 16 V24 M27.5 16 V24" ${N}/><path d="M7 40 C8 31 14 27 20.5 25 M27.5 25 C34 27 40 31 41 40" ${N}/><path d="M21.5 19.5 h5 M21.5 22.5 h5" stroke="#d4923a" stroke-width="1.7" stroke-linecap="round"/>${RAYS(24,21,8)}`,

let S=fresh(),seg=0,startT=null,doneSegs=new Set();
function fresh(){return{date:today(),jd:{},jcur:null}}
const anyPain=()=>Object.values(S.jd||{}).some(e=>e.pain>0);
const reMode=()=>S.visit==='Re-assessment';
const IFS={fell:()=>S.st_fall==='Yes',pain:anyPain,re:reMode,hshow:()=>!reMode()||S.hchange==='Yes, update',senior:()=>parseInt(S.age)>65};
const paused=()=>S.consent==='No';

const MEAS=[['neck','Neck','around the middle of the neck'],['chest','Chest / bust','fullest part'],['arm_r','Upper arm (Right)','mid-arm, relaxed'],['arm_l','Upper arm (Left)','mid-arm, relaxed'],['fore_r','Forearm (Right)','thickest part, below the elbow'],['fore_l','Forearm (Left)','thickest part, below the elbow'],['waist','Waist','midway between lowest rib and top of hip bone'],['umb','Umbilical level','around the navel'],['hipc','Hip','widest part of the buttocks'],['thigh_r','Thigh (Right)','mid-thigh'],['thigh_l','Thigh (Left)','mid-thigh'],['calf_r','Calf (Right)','widest part'],['calf_l','Calf (Left)','widest part']];
const numv=k=>{const v=parseFloat(S[k]);return isNaN(v)?null:v};
function bmiInfo(){const h=numv('height'),w=numv('weight');if(!h||!w)return null;const b=w/((h/100)**2);
 const c=b<18.5?['Underweight','var(--amb)']:b<23?['Normal','var(--ok)']:b<25?['Overweight','var(--amb)']:['Obese','var(--bad)'];return{b,cat:c[0],col:c[1]}}
function mfield(k,l,h,u){return`<div class="mf"><label>${l}<span class="lastv" data-last="${k}"></span></label><div class="in"><input type="number" step="0.1" inputmode="decimal" data-k="${k}" placeholder="–"><span class="u">${u}</span></div>${h?`<div class="hw">${h}</div>`:''}<div class="chg" data-chg="${k}"></div></div>`}
/* ---------- generic UI ---------- */
function ob(k,t,label,v,cls=''){return`<button type="button" class="o ${cls}" data-k="${esc(k)}" data-t="${t}" data-v="${esc(v)}">${esc(label)}</button>`}
function q(it){
 const ifa=it.if?` data-if="${it.if}"`:'';
 const lab=it.l?`<div class="ql"><span>${esc(it.l)}<span class="lastv" data-last="${it.k}"></span></span>${it.e?`<em>${esc(it.e)}</em>`:''}</div>`:'';
 let b='';
 if(it.type==='age')b=`<div class="lr" style="display:flex;align-items:center;gap:8px"><button type="button" class="o" data-age="-1" style="width:40px">−</button><input type="number" data-k="age" min="18" max="100" inputmode="numeric" placeholder="Years" style="width:110px;text-align:center;font-size:18px;font-weight:600"><button type="button" class="o" data-age="1" style="width:40px">+</button><span class="note">tap to type, or use − / +</span></div>`;
 else if(it.type==='text')b=`<input type="text" data-k="${it.k}" maxlength="120"${it.ph?` placeholder="${esc(it.ph)}"`:''}>`;
 else if(it.type==='date')b=`<input type="date" data-k="${it.k}">`;
 else if(it.type==='textarea')b=`<textarea data-k="${it.k}" maxlength="2000"></textarea>`;
 else{b=`<div class="opts">${it.o.map(o=>ob(it.k,it.type,o,o)).join('')}${it.other?ob(it.k,it.type,'+ Other','Other','oth'):''}</div>`;
  if(it.other)b+=`<input type="text" class="oth-in hidden" data-k="${it.k}_other" data-oth="${it.k}" placeholder="Type other…" maxlength="200">`}
 if(it.note)b+=`<input type="text" class="qnote" data-k="${it.k}_note" placeholder="Notes" maxlength="400">`;
 return`<div class="q"${ifa}>${lab}${b}</div>`;
}
function rateRows(list,prefix,opts){return list.map(([k,n,h])=>`<div class="tr"><div><div class="nm">${n}<span class="lastv" data-last="${prefix}${k}"></span></div>${h?`<div class="hw">${h}</div>`:''}</div><div class="opts">${opts.map(([l,v,c])=>ob(prefix+k,'single',l,String(v),c)).join('')}</div></div>`).join('')}

 case'abc6':return`<div class="q"><div class="ql"><span>ABC-6 · balance confidence</span><em>Peretz et al., 2006 · 0% = no confidence · 100% = completely confident</em></div>

function compute(){

 const mmtS=E.length?avg(E.map(([k,e])=>{const[j]=k.split('|');return avg(JT[j].mv.map(m=>({'5':100,'4':80,'3':60,'2':40,'1':20,'0':0})[(e.mmt||{})[m]||'5']))})):100;
 const fv=[...FUNC.map(([k])=>S['f_'+k]),S.f_other].filter(v=>v!==undefined).map(Number);

 const conf={'Very steady':100,'Mostly':75,'Sometimes unsteady':40,'Fear of falling':10}[S.balconf];

 const total=parts.length?avg(parts):null;
 const F=[],oth=k=>S[k+'_other']||'Other';
 if(S.consent==='No')F.push(['r','No consent: defer assessment']);
 E.sort((a,b)=>sev(b[1])-sev(a[1])).forEach(([k,e])=>F.push(['j',entryLines(k),k]));
 if(reMode()&&S.prev){const pj=S.prev.answers.jd||{};Object.keys(pj).filter(x=>hasData(pj[x])&&!hasData((S.jd||{})[x])).forEach(x=>F.push(['g',eName(x)+': resolved since last assessment']));Object.keys(S).filter(x=>x.startsWith('gr_')&&S[x]).forEach(x=>F.push([S[x]==='Not yet'?'a':'g',`Goal “${x.slice(3)}”: ${S[x].toLowerCase()}`]))}
 {const bi=bmiInfo();if(bi&&bi.cat!=='Normal')F.push(['a',`BMI ${bi.b.toFixed(1)} · ${bi.cat.toLowerCase()} (Indian cut-offs)`]);const w=numv('m_waist');if(w&&w>=80)F.push(['a',`Waist ${w} cm · above 80 cm`]);}

 if(S.consent==='No')F.push(['r','No consent: defer assessment']);
 E.sort((a,b)=>sev(b[1])-sev(a[1])).forEach(([k,e])=>F.push(['j',entryLines(k),k]));
 if(reMode()&&S.prev){const pj=S.prev.answers.jd||{};Object.keys(pj).filter(x=>hasData(pj[x])&&!hasData((S.jd||{})[x])).forEach(x=>F.push(['g',eName(x)+': resolved since last assessment']));Object.keys(S).filter(x=>x.startsWith('gr_')&&S[x]).forEach(x=>F.push([S[x]==='Not yet'?'a':'g',`Goal “${x.slice(3)}”: ${S[x].toLowerCase()}`]))}
 if(S.otherArea)F.push(['a','Other area: '+S.otherArea]);
 if(pains.length&&(S.ptype||[]).some(x=>x==='Tingling / numb'||x==='Radiating'))F.push(['a','Nerve-type symptoms: neuro screen']);
 PSQ.forEach((a,i)=>{const v=S['pa_'+(i+1)];if(v!==undefined&&+v<10){const wh=(S['pw_'+(i+1)]||[]).join(', '),nt=S['pn_'+(i+1)];F.push([v==='0'?'r':v==='3'?'a':'',`${a}: ${edLab(v).toLowerCase()}${wh?' · '+wh:''}${nt?' · '+nt:''}`])}});[1,2].forEach(i=>{const v=S['ps_s'+i];if(v!==undefined&&+v<10)F.push([v==='0'?'r':v==='3'?'a':'',`${S['ps_t'+i]||'Other activity'}: ${edLab(v).toLowerCase()}`])});
 const stY=['st_fall','st_unst','st_worry'].filter(k=>S[k]==='Yes');
 if(stY.length)F.push(['a',`STEADI screen positive: ${stY.map(k=>({st_fall:'fallen in past year'+(S.st_times?' ('+S.st_times+(S.st_inj==='Yes'?', injured':'')+')':''),st_unst:'feels unsteady',st_worry:'worries about falling'})[k]).join(' · ')}`]);
 if(S.stage4&&['Unable','Feet together','Semi-tandem'].includes(S.stage4))F.push(['a',`4-Stage Balance: cannot hold tandem 10 s → increased fall risk (CDC)`]);
 else if(S.stage4==='Tandem')F.push(['','4-Stage Balance: held tandem, not single leg']);
 if(ch!=null&&ch<chairLow())F.push(['a',`30-s chair stand ${ch}${S.chair_arms==='Yes'?' (used arms)':''} · below average for age`]);
 FUNC.forEach(([k,n])=>{const v=S['f_'+k];if(v===undefined||v==='100')return;const lab=v==='0'?'can’t':v==='30'?'painful':'difficult',wh=(S['fw_'+k]||[]).join(', '),nt=S['fn_'+k];F.push([v==='0'?'r':v==='30'?'a':'',`${n}: ${lab}${wh?' · '+wh:''}${nt?' · '+nt:''}`])});
 if(S.f_other!==undefined&&S.f_other!=='100')F.push(['',`${S.f_other_txt||'Other activity'}: ${FO.find(x=>String(x[1])===S.f_other)[0].toLowerCase()}`]);
 LBAL.forEach(([k,n])=>{const v=S['lb_'+k];if(v==='20')F.push(['a',n+': avoids']);else if(v==='60')F.push(['',n+': careful'])});
 condLines().forEach(l=>F.push(['h','Health: '+l]));
 {const L=k=>{const v=S[k];if(v===undefined||v===''||(Array.isArray(v)&&!v.length))return'';return(Array.isArray(v)?v:[v]).map(x=>x==='Other'?(S[k+'_other']||'Other'):x).join(', ')};
  if(anyPain()){const bits=[L('dur')&&'since '+L('dur'),L('trend')&&'getting '+L('trend').toLowerCase(),L('ptype')&&'feels like '+L('ptype').toLowerCase(),L('worse')&&'worse with '+L('worse').toLowerCase()].filter(Boolean);if(bits.length)F.push(['','Pain pattern: '+bits.join(' · ')])}
  const po=(S.posture||[]).filter(x=>x!=='Neutral');if(po.length)F.push(['','Posture: '+L('posture').replace(/Neutral,? ?/,'')]);
  if(L('meno'))F.push(['h','Menopause: '+L('meno')]);
  const md=(S.meds||[]).filter(x=>x!=='None');if(md.length)F.push(['h','Medication: '+L('meds')]);
  if(S.sleep==='<5 h'||S.sleep==='5–6 h')F.push(['a','Sleep: '+S.sleep+' a night (short)']);else if(S.sleep)F.push(['h','Sleep: '+S.sleep+' a night']);
  if(S.activity)F.push([S.activity==='Low'?'a':'h','Activity level: '+S.activity]);
  if(S.stage4==='Single leg')F.push(['g','4-Stage Balance: held single leg 10 s (good static balance)']);
  if(S.st_fall==='No'&&S.st_unst==='No'&&S.st_worry==='No')F.push(['g','STEADI screen negative: no falls, steady, no fear of falling']);
  const bi=bmiInfo();if(bi&&bi.cat==='Normal')F.push(['h',`BMI ${bi.b.toFixed(1)} · normal`]);
  const w=numv('weight'),h=numv('height');if(w||h)F.push(['h',`Body: ${h?'height '+h+' cm':''}${h&&w?' · ':''}${w?'weight '+w+' kg':''}${numv('m_waist')?' · waist '+numv('m_waist')+' cm':''}`]);}

 {const bi=bmiInfo();if(bi&&bi.cat!=='Normal')F.push(['a',`BMI ${bi.b.toFixed(1)} · ${bi.cat.toLowerCase()} (Indian cut-offs)`]);const w=numv('m_waist');if(w&&w>=80)F.push(['a',`Waist ${w} cm · above 80 cm`]);}
 return{mob,str,pain,bal,total,F,raw:{maxPain:maxP,psfs:psAvg,chair:ch,abc:abAvg,stageSec:ss,joints:E.length,bmi:(bmiInfo()||{}).b,weight:numv('weight'),waist:numv('m_waist')}};
}
function explain(){
 const r=compute(),ps=psfsVals();
 const E=Object.entries(S.jd||{}).filter(([k,e])=>hasData(e));let maxP=0,maxW='';E.forEach(([k,e])=>{if((e.pain||0)>maxP){maxP=e.pain;maxW=eName(k)}});
 return{mob:ps.length?`${ps.filter(v=>v<10).length} of ${ps.length} activities not easy`:'Activities not rated yet',
  str:r.raw.chair!=null?`${r.raw.chair} stands in 30 s · reference ${chairRef()} for her age${S.chair_arms==='Yes'?' · used arms':''}`:'Chair stand not done yet',
  pain:maxP?`Highest pain ${maxP}/10 (${maxW})`:(r.pain==null?'Pain & movement not checked yet':'No pain recorded'),
  bal:r.raw.stageSec!=null?`4-Stage: ${S.stage4.toLowerCase()} · ${r.raw.stageSec.toFixed(1)} of 40 s held`:'Balance test not done yet'}}
function segDone(i){const s=SEGS[i];if(s.hiddenTab)return false;const has=k=>{const v=S[k];return Array.isArray(v)?v.length>0:v!==undefined&&v!==''};const checks=[];
 s.items.forEach(it=>{(it.row||[it]).forEach(x=>{if(x.req&&vis(x))checks.push(has(x.k))});
  if(it.type==='bodymap')checks.push(doneSegs.has('pain-visited'));
  if(it.type==='hchange'&&reMode())checks.push(!!S.hchange);
  if(it.type==='prevbox'&&reMode())checks.push(!!S.prev);
  if(it.type==='psfs')checks.push(PSQ.every((a,i)=>S['pa_'+(i+1)]!==undefined));
  if(it.type==='stage4v'&&!paused())checks.push(!!S.stage4);
  if(it.type==='chair'&&!paused())checks.push(S.chair!=null||S.chair_arms==='Yes');
  if(it.type==='func')checks.push(FUNC.every(([k])=>S['f_'+k]!==undefined));
  if(it.type==='lbal')checks.push(LBAL.filter(([k])=>S['lb_'+k]!==undefined).length>=3);
  if(it.type==='measure')checks.push(numv('height')!=null&&numv('weight')!=null)});
 return checks.length?{d:checks.filter(Boolean).length,t:checks.length}:{d:0,t:0}}
function renderPsScript(){const el=$('#psScript');if(!el)return;
 if(reMode()&&S.prev){const acts=[1,2,3,4,5].map(i=>S.prev.answers['ps_t'+i]).filter(Boolean);el.innerHTML=`“When I assessed you on ${esc(S.prev.date)}, you told me that you had difficulty with <b>${esc(acts.join(', ')||'…')}</b>. Today, do you still have difficulty with…?” <span class="note">(read each activity and have her score it)</span>`}
 else el.innerHTML=`“I am going to ask you to identify up to three important activities that you are unable to do or are having difficulty with as a result of your problem. Today, are there any activities that you are unable to do or having difficulty with because of your problem?” <span class="note">(show the 0–10 scale and have her rate each activity)</span>`}
let vcd=null;
document.addEventListener('click',e=>{const sp=e.target.closest('[data-step]');if(sp){const[k,d]=sp.dataset.step.split(':');S[k]=Math.max(0,(S[k]??0)+Number(d));touched();return}
 const f=e.target.closest('[data-psfill]');if(f){for(let i=1;i<=5;i++){if(!(S['ps_t'+i]||'').trim()){S['ps_t'+i]=f.dataset.psfill;break}}touched();return}
 if(e.target.closest('#chairT')){clearInterval(vcd);let t=30;const c=$('#chairClock');c.style.color='';c.textContent=t+'s';if(!startT)startT=Date.now();vcd=setInterval(()=>{t--;c.textContent=t>0?t+'s':'Stop';if(t<=0){clearInterval(vcd);c.style.color='var(--bad)'}},1000)}});
document.addEventListener('amble:change',()=>{document.querySelectorAll('[data-fwp]').forEach(el=>{const v=S['pa_'+el.dataset.fwp];el.classList.toggle('hidden',v===undefined||v==='10')});renderPsScript();const cv=$('#chairV');if(cv)cv.textContent=S.chair_arms==='Yes'?'0':(S.chair??'–')});

/* ---------- condition details ---------- */
const CD_EVENT={'Fracture history':'Which bone, and when?','Surgery history':'What surgery, and when?','Recent fall / injury':'What happened, and when?','Hysterectomy':'When, and were the ovaries removed?'};
const ckey=c=>'cd_'+c.replace(/[^a-z0-9]+/gi,'_');
let condSig='';
function renderCond(){const box=$('#condDetail');if(!box)return;const sel=(S.cond||[]).filter(c=>c!=='None');const sig=sel.join('|');if(sig===condSig)return;condSig=sig;
 box.innerHTML=sel.length?`<div class="q" style="background:var(--soft)"><div class="ql"><span>Details</span><em>for each condition ticked</em></div>${sel.map(c=>{const k=ckey(c),name=c==='Other'?(S.cond_other||'Other condition'):c,ev=CD_EVENT[c];
  return`<div class="tr" style="grid-template-columns:170px 1fr;align-items:start"><div class="nm" style="padding-top:8px">${esc(name)}</div><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
   <div style="display:flex;align-items:center;gap:6px"><input type="number" data-k="${k}_yrs" min="0" max="80" step="1" placeholder="–" style="width:70px"><span class="note">${ev?'years ago':'years'}</span></div>
   ${ev?'':`<span class="note">Medication</span>${ob(k+'_med','single','Yes','Yes')}${ob(k+'_med','single','No','No')}`}
   <input type="text" data-k="${k}_note" placeholder="${esc(ev||'Notes (medicine name, dose, control…)')}" maxlength="200" style="flex:1;min-width:200px"></div></div>`}).join('')}</div>`:'';
 box.querySelectorAll('button[data-k]').forEach(b=>b.classList.toggle('on',S[b.dataset.k]===b.dataset.v));
 box.querySelectorAll('input[data-k]').forEach(i=>i.value=S[i.dataset.k]??'')}
function condLines(){return(S.cond||[]).filter(c=>c!=='None').map(c=>{const k=ckey(c),y=S[k+'_yrs'],m=S[k+'_med'],n=S[k+'_note'],name=c==='Other'?(S.cond_other||'Other condition'):c;
 return`${name}${y!==undefined&&y!==''?' · '+y+(CD_EVENT[c]?' yrs ago':' yrs'):''}${m==='Yes'?' · on medication':m==='No'?' · no medication':''}${n?' · '+n:''}`})}
document.addEventListener('amble:change',renderCond);
renderPsScript();update();renderCond();
window.Amble=Object.freeze({schema:SCHEMA,getData,setData,reset,score:compute});
