<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cherub's OS</title>
<meta name="theme-color" content="#e9dfd0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221a15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cherub’s OS">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" id="touchIcon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Pinyon+Script&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme=day]{--bg:#e9dfd0;--panel:#f1e8db;--solid:#f1e8db;--panel2:#e5d8c6;--line:#d8c8b1;--text:#3d2e22;--muted:#806c58;--accent:#9a6238;--gold:#ae8346;--soft:#e7d4bc;--danger:#a6523b;--ok:#687f52;--warn:#a9752f;--blue:#6d7c8a;--onacc:#fbf3e7;--shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.06);--r:16px;--glow:#efe6d8}
[data-theme=night]{--bg:#221a15;--panel:#2d231c;--solid:#2d231c;--panel2:#382b22;--line:#46372b;--text:#e4d5bf;--muted:#a48f77;--accent:#c8935e;--gold:#c6a067;--soft:#44332a;--danger:#c77a60;--ok:#91a679;--warn:#cc9853;--blue:#8fa0ae;--onacc:#231a14;--shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);--glow:#2b211b}
*{box-sizing:border-box}
html,body{margin:0}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 800px at 15% -10%,var(--glow) 0%,transparent 65%),var(--bg)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:transparent;color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{width:18px;height:18px;flex-shrink:0}
h1,h2,h3{margin:0;font-weight:700}
.app{display:flex;min-height:100vh}
.side{background:transparent;width:236px;flex-shrink:0;padding:calc(18px + env(safe-area-inset-top)) 12px 18px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:Fraunces,serif;font-size:21px;font-weight:700}
.logo{width:36px;height:36px;display:inline-block;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(160,60,40,.3))}.logo svg{width:100%;height:100%}.logo.big{width:96px;height:96px;margin-bottom:12px}
.wordmark{font-family:'Pinyon Script',cursive;font-size:38px;line-height:1;color:var(--accent);font-weight:400;display:inline-flex;align-items:baseline;gap:6px}
.wordmark small{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.32em;color:var(--muted);font-weight:600}
.wordmark.big{font-size:72px}
.brand .wordmark{padding:2px 4px}
.mbrand{display:none;align-items:center;justify-content:space-between;margin-bottom:10px}.mbrand .wordmark{font-size:34px}
.brand .crown{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#e0a14a);display:grid;place-items:center;color:#fbf3e7}
.brand .crown svg{width:18px;height:18px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;background:var(--accent);color:var(--onacc);border-radius:20px;padding:0 7px;font-weight:600}
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
main{flex:1;min-width:0;padding:calc(24px + env(safe-area-inset-top)) 32px 48px;max-width:1120px}
.bottom{display:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-family:Fraunces,serif;font-size:30px;letter-spacing:-.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:4px}
.muted{color:var(--muted)}.sm{font-size:13px}.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:600;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.btn{text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--onacc);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn.lg{width:42px;height:42px;background:var(--panel);border:1px solid var(--line)}
.icon-btn.on{color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:30px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip svg{width:15px;height:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
input[type=text],input[type=email],input[type=password],input[type=tel],input:not([type]),input[type=date],input[type=time],input[type=datetime-local],input[type=number],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.hello{font-family:Fraunces,serif;font-size:32px;letter-spacing:-.015em}
.capture{padding:12px;margin-bottom:18px}
.capture input{border:0;padding:8px 6px;font-size:16px;background:transparent}
.qc-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.dcard{padding:16px}
.dcard-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.dcard-h a{margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none;font-weight:500}
.dcard-h svg{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.big-empty{text-align:center;color:var(--muted);padding:48px 16px}
.big-empty .e{font-size:40px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;cursor:pointer}
.row-t{font-weight:500}
.row-m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.row.done .row-t{text-decoration:line-through;color:var(--muted)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;color:#fbf3e7}
.tick.p1{border-color:var(--blue)}.tick.p2{border-color:var(--warn)}.tick.p3{border-color:var(--danger)}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick svg{width:13px;height:13px}
.badge{font-size:12px;font-weight:500}
.badge.late{color:var(--danger)}
.group{margin-bottom:18px}
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:4px 4px 4px}
.list-card{padding:2px 12px}
.addbar{display:flex;gap:8px;margin-bottom:14px}
.addbar input{font-size:15px}
.split{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.list-pane{padding:10px;position:sticky;top:16px;max-height:calc(100vh - 40px);overflow:auto}
.edit-pane{min-height:70vh;padding:22px 26px}
.ni{padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.ni:hover{background:var(--panel2)}
.ni.on{background:var(--soft)}
.ni .t{font-weight:600;display:flex;gap:6px;align-items:center}
.ni .p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .t svg{width:13px;height:13px;color:var(--gold)}
.ed-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.ed-bar .folder{width:150px;padding:6px 10px;font-size:13px}
.note-title{border:0!important;font-family:Fraunces,serif;font-size:28px;font-weight:700;padding:4px 0!important;background:transparent!important}
.note-body{border:0!important;resize:none;min-height:60vh;padding:6px 0!important;font-size:16px;line-height:1.65;background:transparent!important}
.back{display:none}
.tree-i{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;font-weight:500}
.tree-i:hover{background:var(--panel2)}.tree-i.on{background:var(--soft);color:var(--accent)}
.page-icon{font-size:44px;line-height:1;margin-bottom:6px}
.icons{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px;padding:8px;border-radius:12px;background:var(--panel2)}
.icons button{font-size:22px;width:38px;height:38px;border-radius:8px}.icons button:hover{background:var(--panel)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{color:var(--muted)}.crumbs button:hover{color:var(--text)}
.blocks{margin-top:6px}
.blk{display:flex;align-items:flex-start;gap:8px;padding:2px 0;position:relative}
.bx{flex:1;outline:none;min-height:1.6em;padding:3px 2px;line-height:1.6;font-size:16px;word-break:break-word}
.bx:empty::before{content:attr(data-ph);color:var(--muted);opacity:0}
.bx:empty:focus::before,.blocks.one .bx:empty::before{opacity:.7}
.b-h1 .bx{font-size:24px;font-weight:700;font-family:Fraunces,serif;margin-top:10px}
.b-h2 .bx{font-size:19px;font-weight:700;margin-top:6px}
.b-quote .bx{border-left:3px solid var(--accent);padding-left:12px;color:var(--muted);font-style:italic}
.b-todo input{margin-top:7px;width:17px;height:17px;accent-color:var(--accent)}
.b-todo.chk .bx{text-decoration:line-through;color:var(--muted)}
.b-bullet .dot{margin-top:4px;width:12px;text-align:center;font-weight:700}
.b-divider hr{flex:1;border:0;border-top:1px solid var(--line);margin:12px 0}
.blk .x{opacity:0;color:var(--muted);padding:4px}
.blk:hover .x{opacity:1}
.blk-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.subpages{margin-top:22px}
.subpages .tree-i{background:var(--panel2);margin-bottom:6px}
.cal-wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.cal{padding:14px}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-h h3{font-family:Fraunces,serif;font-size:20px;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.day{aspect-ratio:1/1;min-height:44px;border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:500;font-size:14px}
.day:hover{background:var(--panel2)}
.day.out{color:var(--muted);opacity:.45}
.day.today .n{background:var(--accent);color:#fbf3e7;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.day.sel{background:var(--soft);outline:2px solid var(--accent)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.ev{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ev:last-child{border-bottom:0}
.ev .bar{width:4px;border-radius:4px;align-self:stretch}
.ev .tm{width:64px;font-size:13px;color:var(--muted);flex-shrink:0;padding-top:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:8px;background:var(--accent)}
.meter i.over{background:var(--danger)}
.money-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;align-items:start}
.catrow{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.catrow .meter{margin:0}
.catrow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx .em{width:36px;height:36px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:18px}
.tx .a{font-weight:600;font-variant-numeric:tabular-nums}
.tx .a.in{color:var(--ok)}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sec-h h3{font-size:16px}
.pad{padding:16px}
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,5,20,.45)}
.sheet{background:var(--solid)!important;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet-h{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.sheet-h h3{font-family:Fraunces,serif;font-size:21px}
.sheet-f{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:4px}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.fld.half{grid-column:auto}
.fld input,.fld select,.fld textarea{color:var(--text);font-weight:400;font-size:15px}
.chk{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-weight:500}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{cursor:pointer}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:inline-flex;padding:6px 11px;border-radius:20px;border:1px solid var(--line);font-weight:500;color:var(--text);font-size:13.5px}
.radios input:checked+span{background:var(--text);color:var(--bg);border-color:var(--text)}
.radios .sw{width:28px;height:28px;border-radius:50%;padding:0;border:3px solid transparent}
.radios input:checked+.sw{border-color:var(--text);background-clip:padding-box}
.srch{grid-template-columns:1fr;top:12vh;transform:translateX(-50%)}
.sres{max-height:55vh;overflow:auto}
.sr{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}
.sr:hover{background:var(--panel2)}
.sr .k{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;width:68px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#alerts{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100vw - 24px))}
.alert{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 10px 10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.alert svg{color:var(--gold)}
.note-bar{background:var(--soft);color:var(--accent);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:14px;font-weight:500}
.splash{min-height:100vh;display:grid;place-items:center;font-family:Fraunces,serif;font-size:24px;color:var(--muted)}
.prefs{max-width:620px;display:flex;flex-direction:column;gap:14px}
.prefs .pad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prefs h3{grid-column:1/-1;font-size:16px}
.prefs textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:12px}
.morelist{grid-template-columns:1fr;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%)}
.dcard.wide{grid-column:1/-1}
.pill{font-size:12px;background:var(--soft);color:var(--accent);padding:2px 9px;border-radius:20px;font-weight:600}
.av{width:38px;height:38px;border-radius:50%;color:#fbf3e7;display:grid;place-items:center;font-weight:700;flex-shrink:0;cursor:pointer;font-size:15px}
.av.lg{width:50px;height:50px;font-size:20px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.srow.st-done .row-t,.srow.st-skip .row-t,.srow.st-moved .row-t{color:var(--muted)}
.sact{display:flex;gap:6px;flex-wrap:wrap}
.btn.okb{background:var(--ok);color:var(--onacc);border-color:transparent}
a.btn[href*='wa.me']{background:#5f8a62;color:#fbf3e7;border-color:transparent}
.btn svg{width:15px;height:15px}
.schip{padding:6px 11px;border-radius:20px;font-size:13px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.schip .u{font-weight:500;opacity:.65;font-size:12px;text-decoration:underline}
.schip.st-done{background:rgba(47,158,107,.13);color:var(--ok)}
.schip.st-skip{background:rgba(208,68,60,.1);color:var(--danger)}
.schip.st-moved{background:var(--soft);color:var(--accent)}
.ask{margin-top:12px;padding-top:6px;border-top:1px dashed var(--line)}
.sess-foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.sess-foot b{color:var(--text)}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer}
.ccard.paused{opacity:.55}
.due{color:var(--danger);font-weight:700}
.settled{color:var(--ok);font-weight:600;font-size:13px}

.hstats{margin-bottom:18px}
.stat.warn .v{color:var(--danger)}
.cboxes,.bills{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.cbox{padding:16px;border-top:5px solid var(--cc)}
.cbox-h{display:flex;gap:12px;align-items:center}
.cbox-n{font-weight:700;font-size:17px}
.cbox-due{text-align:right;display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.cbox-due b{color:var(--danger);font-size:16px}
.tl{margin-top:12px;padding:10px;border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px}

 if(Store.mode!=='cloud')return;

function parseTask(s){let due='',priority=0,list='Inbox';const t=today();
 s=s.replace(/(^|\s)!([1-3])\b/,(m,a,p)=>{priority=+p;return' '});
 s=s.replace(/(^|\s)#([\p{L}\w-]+)/u,(m,a,l)=>{list=l[0].toUpperCase()+l.slice(1);return' '});
 s=s.replace(/\b(today|tonight)\b/i,()=>{due=t;return''}).replace(/\b(tomorrow|tmrw|tmr)\b/i,()=>{due=addDays(t,1);return''}).replace(/\bnext week\b/i,()=>{due=addDays(t,7);return''});
 s=s.replace(/\b(?:on\s+)?(mon|tues?|wed(?:nes)?|thu(?:rs)?|fri|sat(?:ur)?|sun)(?:day)?\b/i,(m,w)=>{const idx=['sun','mon','tue','wed','thu','fri','sat'].indexOf(w.slice(0,3).toLowerCase());let n=(idx-new Date().getDay()+7)%7||7;due=addDays(t,n);return''});
 return{title:s.replace(/\s+/g,' ').trim(),due,priority,list}}

const curPage=()=>ui.pageId&&get(ui.pageId);
function caretOffset(el){const s=getSelection();if(!s.rangeCount)return 0;const r=s.getRangeAt(0),pre=r.cloneRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);return pre.toString().length}
function setCaret(el,pos){el.focus();const r=document.createRange(),s=getSelection();const tn=el.firstChild;if(tn&&tn.nodeType===3){r.setStart(tn,Math.min(pos,tn.length))}else{r.selectNodeContents(el);r.collapse(pos<=0)}r.collapse(true);s.removeAllRanges();s.addRange(r)}
function focusBlock(bid,pos){after=()=>{const el=document.querySelector(`.bx[data-bid="${bid}"]`);if(el)setCaret(el,pos==null?el.textContent.length:pos)}}
function blockKey(e){const el=e.target,pg=curPage();if(!pg)return;const i=pg.blocks.findIndex(b=>b.id===el.dataset.bid);if(i<0)return;const b=pg.blocks[i];
 if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();b.x=el.textContent;
  if((b.t==='todo'||b.t==='bullet'||b.t==='quote'||b.t==='h1'||b.t==='h2')&&!b.x){b.t='p';focusBlock(b.id,0);put(pg,{delay:300});return}
  const pos=caretOffset(el),rest=b.x.slice(pos);b.x=b.x.slice(0,pos);
  const nb={id:uid(),t:b.t==='todo'||b.t==='bullet'?b.t:'p',x:rest};pg.blocks.splice(i+1,0,nb);focusBlock(nb.id,0);put(pg,{delay:300});return}
 if(e.key==='Backspace'){const s=getSelection();if(!s.isCollapsed||caretOffset(el)!==0)return;e.preventDefault();b.x=el.textContent;
  if(b.t!=='p'){b.t='p';b.c=false;focusBlock(b.id,0);put(pg,{delay:300});return}
  if(i===0)return;const prev=pg.blocks[i-1];
  if(prev.t==='divider'){pg.blocks.splice(i-1,1);focusBlock(b.id,0);put(pg,{delay:300});return}
  const at=prev.x.length;prev.x+=b.x;pg.blocks.splice(i,1);focusBlock(prev.id,at);put(pg,{delay:300});return}
 if(e.key==='ArrowUp'&&i>0&&caretOffset(el)===0){const p=pg.blocks.slice(0,i).reverse().find(x=>x.t!=='divider');if(p){e.preventDefault();const t=document.querySelector(`.bx[data-bid="${p.id}"]`);t&&setCaret(t,t.textContent.length)}}
 if(e.key==='ArrowDown'&&caretOffset(el)===el.textContent.length){const n=pg.blocks.slice(i+1).find(x=>x.t!=='divider');if(n){e.preventDefault();const t=document.querySelector(`.bx[data-bid="${n.id}"]`);t&&setCaret(t,0)}}
}
function blockInput(el){const pg=curPage();if(!pg)return;const b=pg.blocks.find(x=>x.id===el.dataset.bid);if(!b)return;
 if(el.textContent===''&&el.innerHTML!=='')el.innerHTML='';
 let x=el.textContent;
 if(b.t==='p'){const rules=[[/^#\s/,'h1'],[/^##\s/,'h2'],[/^[-*]\s/,'bullet'],[/^\[\s?\]\s/,'todo'],[/^>\s/,'quote']];
  for(const[re,t]of rules){if(re.test(x)){b.t=t;b.x=x.replace(re,'');focusBlock(b.id,0);put(pg,{delay:300});return}}
  if(x==='---'){b.t='divider';b.x='';const i=pg.blocks.indexOf(b);const nb={id:uid(),t:'p',x:''};pg.blocks.splice(i+1,0,nb);focusBlock(nb.id,0);put(pg,{delay:300});return}}

const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function scheduledOn(c,d){if(c.active===false||c.sched==='flex')return false;if(c.start&&d<c.start)return false;
 if(c.sched==='alt'){const base=c.altStart||c.start;if(!base)return false;const diff=Math.round((parseD(d)-parseD(base))/864e5);return diff>=0&&diff%2===0}
 return(c.days||[]).map(Number).includes(parseD(d).getDay())}
function sessionsOn(d,cid){return memo('so:'+d+':'+(cid||''),()=>{const out=[],seen=new Set();
 const idx=memo('sidx',()=>{const m={};all('session').forEach(s=>{(m[s.date]=m[s.date]||[]).push(s)});return m});
 all('client').forEach(c=>{if(cid&&c.id!==cid)return;if(scheduledOn(c,d)){const id='r_'+c.id+'_'+d;seen.add(id);out.push({id,c,s:get(id),date:d})}});
 (idx[d]||[]).forEach(s=>{if(seen.has(s.id)||(cid&&s.clientId!==cid))return;if(!s.extra&&!s.status)return;const c=get(s.clientId);if(c)out.push({id:s.id,c,s,date:d})});
 return out.sort((a,b)=>ordCmp(a.c,b.c))})}
const ordCmp=(x,y)=>((x.order??1e12)-(y.order??1e12))||((x.created||0)-(y.created||0));
const sortClients=a=>a.slice().sort(ordCmp);
const stOf=x=>x.s?x.s.status||'pending':'pending';
function unmarked(cid){const t=today(),res=[];for(let i=1;i<=30;i++){const d=addDays(t,-i);sessionsOn(d,cid).forEach(x=>{if(stOf(x)!=='pending')return;if(!x.s&&x.c.created&&d<ymd(new Date(x.c.created)))return;res.push(x)})}return res}
function monthsBetween(a,b){const x=parseD(a),y=b?parseD(b):new Date();return Math.max(0,(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth()+1)}
const pDate=p=>p.forDate||p.date||'';
const collected=ym=>all('payment').filter(p=>pDate(p).startsWith(ym)).reduce((a,p)=>a+(Number(p.amount)||0),0);
function ageOf(dob,on){if(!dob)return null;const a=parseD(dob),b=parseD(on||today());let y=b.getFullYear()-a.getFullYear();if(b.getMonth()<a.getMonth()||(b.getMonth()===a.getMonth()&&b.getDate()<a.getDate()))y--;return y}
function bdayMatch(dob,d){if(!dob)return false;let md=dob.slice(5,10);const y=+d.slice(0,4);if(md==='02-29'&&!((y%4===0&&y%100!==0)||y%400===0))md='02-28';return d.slice(5,10)===md}
const birthdaysOn=d=>sortClients(all('client').filter(c=>c.active!==false&&bdayMatch(c.dob,d)));
const fmtDob=d=>parseD(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function clientMoney(c){return memo('cm:'+c.id,()=>{const done=all('session').filter(s=>s.clientId===c.id&&s.status==='done'&&!isDemo(c,s.date)).length,ps=all('payment').filter(p=>p.clientId===c.id);
 const paid=ps.reduce((a,p)=>a+(Number(p.amount)||0),0),loose=ps.filter(p=>!p.billId&&!p.pkg).reduce((a,p)=>a+(Number(p.amount)||0),0);let due=0,remaining=null;
 if(c.pay==='package'){const n=Number(c.pkgSessions)||0,pr=Number(c.pkgPrice)||0,bought=ps.filter(p=>p.pkg).length;remaining=bought*n-done;due=bought*pr+(remaining<0&&n?(-remaining)*pr/n:0)-ps.filter(p=>p.pkg||!p.billId).reduce((a,p)=>a+(Number(p.amount)||0),0)}
 else due=allBills(c.id).filter(b=>!b.paid).reduce((a,b)=>a+b.amount,0)-loose;
 return{done,paid,due:Math.round(due*100)/100,remaining}})}
function payLabel(c,m){if(c.pay==='monthly')return money(c.fee)+'/month';if(c.pay==='package'){const r=m.remaining;return r>0?r+' session'+(r===1?'':'s')+' left':r===0?'Package used up':(-r)+' over package'}return money(c.rate)+'/session'}
function schedText(c){if(c.sched==='flex')return'Flexible days';if(c.sched==='alt')return'Alternate days';const d=(c.days||[]).map(Number);if(d.length===7)return'Every day';if(d.length===6&&!d.includes(0))return'Mon–Sat';if(d.length===5&&!d.includes(0)&&!d.includes(6))return'Mon–Fri';return[1,2,3,4,5,6,0].filter(i=>d.includes(i)).map(i=>DOW[i]).join(', ')||'No days set'}
const av=(c,lg)=>`<span class="av ${lg?'lg':''}" style="background:${esc(c.color||COLORS[0])}" data-act="openClient" data-id="${c.id}">${esc(String(c.name||'?').trim()[0]||'?').toUpperCase()}</span>`;

 m.innerHTML=`<div class="scrim" data-act="rCancel" ${a}></div><div class="sheet morelist" style="grid-template-columns:1fr"><div class="sheet-h"><h3>Why was it cancelled?</h3><button class="icon-btn" data-act="rCancel" ${a} aria-label="Close">✕</button></div>

function openLater(bid,ret){ui.checkinOpen=false;const b=getBill(bid);if(!b)return;const t=today(),a=`data-b="${esc(bid)}" data-ret="${ret?1:''}"`,m=$('#modal');
 const opt=(n,l)=>`<button class="nav" data-act="laterTo" data-to="${addDays(t,n)}" ${a}>⏰&nbsp; ${l} · ${parseD(addDays(t,n)).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</button>`;
 m.innerHTML=`<div class="scrim" data-act="lCancel" ${a}></div><div class="sheet morelist" style="grid-template-columns:1fr"><div class="sheet-h"><h3>Remind me about ${esc(b.c.name)}’s payment</h3><button class="icon-btn" data-act="lCancel" ${a} aria-label="Close">✕</button></div>

function openPostpone(data,ret){ui.checkinOpen=false;const{sid,c,d}=data,cl=get(c);if(!cl)return;const base=d<today()?today():d,t1=addDays(base,1),t7=addDays(base,7);
 const a=`data-sid="${esc(sid)}" data-c="${c}" data-d="${d}" data-ret="${ret?1:''}"`,m=$('#modal');
 const lab=x=>parseD(x).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
 m.innerHTML=`<div class="scrim" data-act="pCancel" ${a}></div><div class="sheet morelist postsheet" style="grid-template-columns:1fr"><div class="sheet-h"><h3>Reschedule ${esc(cl.name)}’s session</h3><button class="icon-btn" data-act="pCancel" ${a} aria-label="Cancel">✕</button></div>

function sessRow(x,showDate){const c=x.c,m=clientMoney(c);
 const meta=[showDate?dueLabel(x.date):'',x.s&&x.s.from?'↻ from '+dueLabel(x.s.from):'',payLabel(c,m)].filter(Boolean).map(s=>`<span>${esc(s)}</span>`).join('');
 return`<div class="srow st-${stOf(x)}">${av(c)}<div class="grow" data-act="openClient" data-id="${c.id}" style="cursor:pointer"><div class="row-t">${esc(c.name)}</div><div class="row-m">${meta}</div></div>${sessActions(x)}</div>`}
const weekStartOf=d=>{const x=parseD(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return ymd(x)};
function weekSessions(c,mon){const out=[];for(let i=0;i<7;i++)sessionsOn(addDays(mon,i),c.id).forEach(x=>out.push(x));return out}
const fmtRange=(a,b)=>a.slice(0,7)===b.slice(0,7)?parseD(a).getDate()+'–'+fmtShort(b):fmtShort(a)+' – '+fmtShort(b);
const lastDay=ym=>ymd(new Date(+ym.slice(0,4),+ym.slice(5,7),0));
const dlab=d=>parseD(d).toLocaleDateString('en-IN',{weekday:'short',day:'numeric'});
const paidFrom=c=>c.paidFrom||c.start||'';
const isDemo=(c,d)=>c.paidFrom?d<c.paidFrom:!!c.trial;
const demoDone=c=>all('session').filter(s=>s.clientId===c.id&&s.status==='done'&&isDemo(c,s.date)).length;
const demoTarget=c=>Number(c.demos)||2;
function scheduledRaw(c,d){return scheduledOn({...c,start:'',active:true},d)}
function plannedIn(c,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1))if(scheduledOn(c,d))out.push(d);return out}
// Weekly clients pay in ADVANCE: the bill made on Sunday covers the coming Mon–Sun.
function billFor(c,sun){const id='b_'+c.id+'_'+sun,from=addDays(sun,1),to=addDays(sun,7),doc=get(id),paid=!!(doc&&doc.status==='paid'),rate=Number(c.rate)||0;
 const planned=plannedIn(c,from,to).filter(d=>!isDemo(c,d));
 const prevPaid=((get('b_'+c.id+'_'+addDays(sun,-7))||{}).status==='paid');
 const cancelled=[];if(prevPaid)for(let d=addDays(sun,-6);d<=sun;d=addDays(d,1))sessionsOn(d,c.id).forEach(x=>{if(stOf(x)==='skip'&&!isDemo(c,x.date))cancelled.push(x.date)});
 const gross=planned.length*rate,credit=cancelled.length*rate;
 return{kind:'week',id,c,sun,from,to,planned,cancelled,rate,gross,credit,doc,paid,count:paid?doc.count:planned.length,amount:paid?doc.amount:Math.max(0,gross-credit)}}
function bills(cid){return memo('bills:'+(cid||''),()=>{const t=today(),lastSun=parseD(t).getDay()===0?t:addDays(weekStartOf(t),-1),res=[];
 all('client').forEach(c=>{if(cid&&c.id!==cid)return;if((c.pay||'session')!=='session')return;
  const from=paidFrom(c)||ymd(new Date(c.created||Date.now()));
  for(let s=lastSun,i=0;i<26&&addDays(s,7)>=from;s=addDays(s,-7),i++){const b=billFor(c,s);if(b.planned.length||b.paid)res.push(b)}});
 return res})}
// Monthly clients pay in ADVANCE: on the last day of a month, the next month's fee is due.
function monthShare(c,ym){const pf=paidFrom(c),a=ym+'-01',z=lastDay(ym);if(!pf||pf<=a||pf.slice(0,7)!==ym)return null;
 const all_=[];for(let d=a;d<=z;d=addDays(d,1))if(scheduledRaw(c,d))all_.push(d);
 if(all_.length){const part=all_.filter(d=>d>=pf).length;return{part,of:all_.length,frac:part/all_.length,by:'sessions'}}
 const days=+z.slice(8),left=days-(+pf.slice(8))+1;return{part:left,of:days,frac:left/days,by:'days'}}
function mbillFor(c,ym){const id='m_'+c.id+'_'+ym,doc=get(id),paid=!!(doc&&doc.status==='paid'),fee=Number(c.fee)||0,sh=monthShare(c,ym);
 const amt=sh?Math.round(fee*sh.frac/10)*10:fee;
 return{kind:'month',id,c,ym,from:ym+'-01',to:lastDay(ym),doc,paid,count:0,share:sh,amount:paid?doc.amount:amt}}
function mbills(cid){return memo('mbills:'+(cid||''),()=>{const t=today(),cur=t.slice(0,7),res=[];
 all('client').forEach(c=>{if(cid&&c.id!==cid)return;if(c.pay!=='monthly'||(c.trial&&!c.paidFrom))return;const st=(paidFrom(c)||t).slice(0,7);
  let last=t===lastDay(cur)?shiftMonth(cur,1):cur;if(c.active===false&&c.end&&c.end.slice(0,7)<last)last=c.end.slice(0,7);
  for(let m=last,i=0;i<24&&m>=st;m=shiftMonth(m,-1),i++){const b=mbillFor(c,m);if(b.amount>0||b.paid)res.push(b)}});
 return res})}
const allBills=cid=>[...bills(cid),...mbills(cid)].sort((a,b)=>(a.paid-b.paid)||(a.from<b.from?1:a.from>b.from?-1:ordCmp(a.c,b.c)));
function getBill(id){const p=String(id).split('_'),k=p[0],key=p[p.length-1],c=get(p.slice(1,-1).join('_'));if(!c)return null;return k==='m'?mbillFor(c,key):billFor(c,key)}
const billTitle=b=>b.kind==='month'?monthLabel(b.ym)+' fee'+(b.share?` (part month: ${b.share.part} of ${b.share.of} ${b.share.by})`:''):'Week '+fmtRange(b.from,b.to);
function billText(b){const p=prefs();
 if(b.kind==='month')return`Hi ${b.c.name},\nThis is a reminder for your monthly fee for ${monthLabel(b.ym)}: ${money(b.amount)}.\n\nThank you!\n— ${p.name||''}`;
 return`Hi ${b.c.name},\nHere is the advance for next week, ${fmtRange(b.from,b.to)}:\n\nSessions: ${b.planned.map(dlab).join(', ')}\n${b.planned.length} session${b.planned.length===1?'':'s'} × ${money(b.rate)} = ${money(b.gross)}${b.credit?`\nLess ${b.cancelled.length} cancelled last week (${b.cancelled.map(dlab).join(', ')}): −${money(b.credit)}`:''}\n\nTotal: ${money(b.amount)}\n\nThank you!\n— ${p.name||''}`}
function billSub(b){return b.kind==='month'?'Monthly fee · paid in advance':`${b.count} session${b.count===1?'':'s'} × ${money(b.rate)}${!b.paid&&b.credit?` − ${b.cancelled.length} cancelled`:''}`}

 all('session').forEach(s=>{if(s.status!=='done'||s.date<from||s.date>to)return;const c=get(s.clientId);if(!c||isDemo(c,s.date))return;const v=sessVal(c);n++;amt+=v;const p=per[c.id]=per[c.id]||{n:0,a:0};p.n++;p.a+=v});
 if(month)all('client').forEach(c=>{if(c.pay==='monthly'&&!(c.trial&&!c.paidFrom)&&paidFrom(c)<=to&&(c.active!==false||(c.end||'')>=from)){const f=mbillFor(c,from.slice(0,7)).amount;const p=per[c.id]=per[c.id]||{n:0,a:0};p.a+=f;amt+=f}});
 const rec=all('payment').filter(p=>pDate(p)>=from&&pDate(p)<=to).reduce((a,p)=>a+(Number(p.amount)||0),0);
 return{n,amt,per,rec}}

function monthCalc(c,ym){const t=today(),end=lastDay(ym),r={planned:0,done:0,skip:0,moved:0,unmarked:0,todo:0,demo:0,reasons:[]};

function pushSupported(){return'Notification' in window&&'serviceWorker' in navigator&&window.firebase&&firebase.messaging&&firebase.messaging.isSupported&&firebase.messaging.isSupported()}
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function setupPush(ask){
 if(!pushSupported()||!VAPID||!Store.uid)return'unsupported';
 if(ask){const p=await Notification.requestPermission();if(p!=='granted')return p}else if(Notification.permission!=='granted')return Notification.permission;
 try{const reg=Store.swReg||await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  const msg=firebase.messaging();const token=await msg.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(token){await Store.db.collection('users').doc(Store.uid).collection('devices').doc(token.replace(/[^A-Za-z0-9_-]/g,'').slice(-120)).set({token,ua:navigator.userAgent.slice(0,200),updated:Date.now()});}

 toggleShowDone(){ui.showDone=!ui.showDone;render()},
 calDay(el){ui.calDay=el.dataset.d;if(el.dataset.d.slice(0,7)!==ui.calMonth)ui.calMonth=el.dataset.d.slice(0,7);render()},
 calMove(el){ui.calMonth=shiftMonth(ui.calMonth,+el.dataset.n);render()},calToday(){ui.calMonth=today().slice(0,7);ui.calDay=today();render()},
 newEvent(){editEvent({date:ui.route==='calendar'?ui.calDay:today()})},editEvent(el){editEvent(get(el.dataset.id))},
 monMove(el){ui.moneyMonth=shiftMonth(ui.moneyMonth,+el.dataset.n);render()},
 newExp(el){editExp({type:el.dataset.t,date:ui.moneyMonth===today().slice(0,7)?today():ui.moneyMonth+'-01'})},editExp(el){editExp(get(el.dataset.id))},
 newNote,openNote(el){if(ui.noteId!==el.dataset.id)dropEmptyNote();ui.noteId=el.dataset.id;go('notes');if(ui.route==='notes')render()},
 notesBack(){dropEmptyNote();ui.noteId=null;render()},
 noteFolderSel(el){ui.noteFolder=el.dataset.f;render()},
 pinNote(){const n=get(ui.noteId);if(n){n.pinned=!n.pinned;put(n);toast(n.pinned?'Pinned':'Unpinned')}},
 delNote(el){if(el.dataset.armed){remove(ui.noteId);ui.noteId=null;toast('Note deleted');render();return}el.dataset.armed=1;toast('Tap delete again to remove this note');setTimeout(()=>{delete el.dataset.armed},3000)},
 newPage(el){newPage(el.dataset.parent)},openPage(el){ui.pageId=el.dataset.id;ui.iconPick=false;go('pages');if(ui.route==='pages')render()},
 pagesBack(){ui.pageId=null;render()},
 delPage(el){if(!el.dataset.armed){el.dataset.armed=1;toast('Tap delete again to remove this page');setTimeout(()=>{delete el.dataset.armed},3000);return}
  const pg=curPage();if(!pg)return;all('page').filter(p=>p.parent===pg.id).forEach(k=>{k.parent=pg.parent||'';put(k,{silent:true})});ui.pageId=pg.parent||null;remove(pg.id);toast('Page deleted')},
 iconPick(){ui.iconPick=!ui.iconPick;render()},setIcon(el){const pg=curPage();if(pg){pg.icon=el.dataset.e;ui.iconPick=false;put(pg)}},
 addBlk(el){const pg=curPage();if(!pg)return;const t=el.dataset.t;const last=pg.blocks[pg.blocks.length-1];
  if(t!=='divider'&&last&&last.t!=='divider'&&!last.x){last.t=t;focusBlock(last.id,0)}
  else{const nb={id:uid(),t,x:''};pg.blocks.push(nb);if(t==='divider'){const p2={id:uid(),t:'p',x:''};pg.blocks.push(p2);focusBlock(p2.id,0)}else focusBlock(nb.id,0)}
  put(pg,{delay:300})},
 blkCheck(el){const pg=curPage();const b=pg&&pg.blocks.find(x=>x.id===el.dataset.bid);if(b){b.c=el.checked;put(pg,{delay:300})}},
 blkDel(el){const pg=curPage();if(!pg)return;pg.blocks=pg.blocks.filter(x=>x.id!==el.dataset.bid);put(pg,{delay:300})},
 openResult(el){openItem(get(el.dataset.id))},
 alertDone(el){const r=get(el.dataset.id);if(r)completeRem(r);checkAlerts()},
 alertSnooze(el){const r=get(el.dataset.id);if(r){r.at=toLocal(new Date(Date.now()+6e5));put(r);toast('Snoozed 10 minutes')}checkAlerts()},
 alertX(el){const r=get(el.dataset.id);if(r)dismissed.add(r.id+r.at);checkAlerts()},
 copyExport(){const ta=$('#exportTa');navigator.clipboard.writeText(ta.value).then(()=>toast('Backup copied')).catch(()=>{ta.focus();ta.select();toast('Selected — use your Copy command')})},
 doImport(){let arr;try{arr=JSON.parse($('#importTa').value)}catch(e){toast('That doesn’t look like a backup');return}
  if(!Array.isArray(arr)){toast('That doesn’t look like a backup');return}
  const kinds=['note','page','task','reminder','event','expense','prefs','client','session','payment','bill','assessment'];
  const items=arr.filter(i=>i&&kinds.includes(i.kind)).map(i=>({...i,id:i.kind==='prefs'?'prefs':(/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(i.id||'')?i.id:uid())}));
  toast('Restoring '+items.length+' items…');bulk(items).then(()=>toast('Restored '+items.length+' items'))},
 eraseAll(el){if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Tap again to erase ALL data';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Erase everything'}},4000);return}
  const items=[...Store.items.values()];ui.noteId=ui.pageId=null;bulk(items,true).then(()=>toast('Everything erased'))}
};
function quick(k,v){
 if(k==='task'){if(!v){editTask({due:today()});return}const t=parseTask(v);if(!t.title){toast('Add a task name');return}put({kind:'task',id:uid(),...t,done:false,created:Date.now(),notes:''});toast('Task added'+(t.due?' · '+dueLabel(t.due):''))}
 else if(k==='note'){newNote();if(v){const n=get(ui.noteId);n.title=v;put(n)}}
 else if(k==='reminder')editRem({title:v});
 else if(k==='event'){const t=parseTask(v);editEvent({title:t.title,date:t.due||today()})}
 else if(k==='expense'){const m=v.match(/(\d+(?:\.\d+)?)/);const note=v.replace(m?m[0]:'','').replace(/\s+/g,' ').trim();const cats=prefs().cats.split(',').map(s=>s.trim());const cat=cats.find(c=>note.toLowerCase().includes(c.toLowerCase()))||(/(lunch|dinner|breakfast|coffee|chai|food|zomato|swiggy)/i.test(note)?'Food':/(uber|ola|auto|metro|petrol|fuel|cab)/i.test(note)?'Transport':undefined);editExp({type:'out',amount:m?Number(m[0]):'',note,cat,date:today()})}
 const i=$('#qcIn');if(i)i.value='';
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('submit',e=>{
 if(e.target.id==='authForm'){e.preventDefault();doAuth();return}
 if(e.target.id==='qcForm'){e.preventDefault();quick('task',$('#qcIn').value.trim())}
 if(e.target.id==='taskAdd'){e.preventDefault();const v=$('#taskIn').value.trim();if(!v)return;const t=parseTask(v);if(!t.title)return;if(!t.due&&ui.taskFilter==='today')t.due=today();if(ui.taskFilter.startsWith('list:')&&t.list==='Inbox')t.list=ui.taskFilter.slice(5);
  put({kind:'task',id:uid(),...t,done:false,created:Date.now(),notes:''});after=()=>{const i=$('#taskIn');i&&i.focus()};render();toast('Task added'+(t.due?' · '+dueLabel(t.due):''))}
});
document.addEventListener('input',e=>{
 const el=e.target;if(el.id==='vText'){V.text=el.value;return}if(el.classList.contains('bx')){blockInput(el);return}
 const k=el.dataset.in;if(!k)return;
 if(k==='noteTitle'||k==='noteBody'||k==='noteFolder'){const n=get(ui.noteId);if(!n)return;n[k==='noteTitle'?'title':k==='noteBody'?'body':'folder']=el.value;put(n,{delay:700,silent:true});const li=$('#ni-'+n.id);if(li){li.querySelector('.ell').textContent=n.title||firstLine(n.body)||'New note';li.querySelector('.p').textContent=snippet(n)}}
 else if(k==='pageTitle'){const pg=curPage();if(pg){pg.title=el.value;put(pg,{delay:700,silent:true})}}
 else if(k==='noteQ'){ui.noteQ=el.value;const pos=el.selectionStart;after=()=>{const i=$('#noteQ');if(i){i.focus();i.setSelectionRange(pos,pos)}};render()}
 else if(k==='search')runSearch(el.value);
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.ch==='prefNotif'){const p=prefs();p.notifNames=el.checked;put(p);toast('Saved');return}if(el.dataset.ch==='pref'){const p=prefs();p[el.dataset.k]=el.type==='number'?(Number(el.value)||0):el.value;put(p);toast('Saved')}});
document.addEventListener('keydown',e=>{
 if(e.target.classList&&e.target.classList.contains('bx'))blockKey(e);
 if(e.target.id==='pageTitle'&&e.key==='Enter'){e.preventDefault();const pg=curPage();if(pg&&pg.blocks[0]){const t=document.querySelector(`.bx[data-bid="${pg.blocks[0].id}"]`);t&&setCaret(t,0)}}
 if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal();
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}
});
document.addEventListener('paste',e=>{if(e.target.classList&&e.target.classList.contains('bx')){e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s*\n\s*/g,' ');document.execCommand('insertText',false,t)}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());

// ---------- reminders alerts ----------
const dismissed=new Set();
function checkAlerts(){const box=$('#alerts');if(!Store.ready){box.innerHTML='';return}
 const now=nowLocal(),from=toLocal(new Date(Date.now()-12*36e5));
 const due=all('reminder').filter(r=>!r.done&&r.at&&r.at<=now&&r.at>=from&&!dismissed.has(r.id+r.at)).sort(byAt).slice(0,3);
 setTimeout(maybePrompt,800);box.innerHTML=due.map(r=>`<div class="alert">${ic('bell')}<div class="grow"><b>${esc(r.title)}</b><div class="muted sm">${fmtAt(r.at)}</div></div><button class="btn sm" data-act="alertSnooze" data-id="${r.id}">10 min</button><button class="btn sm primary" data-act="alertDone" data-id="${r.id}">Done</button><button class="icon-btn" data-act="alertX" data-id="${r.id}" aria-label="Dismiss">✕</button></div>`).join('')}
setInterval(checkAlerts,20000);
setInterval(()=>{if(prefs().theme==='timed'){const b=document.documentElement.dataset.theme;applyTheme();if(b!==document.documentElement.dataset.theme)render()}},60000);
setInterval(maybePrompt,30000);

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
window.addEventListener('pagehide',()=>{if(Store.mode==='local'){clearTimeout(Store.timers._ls);saveLocal()}});
async function liveTouchIcon(){try{await document.fonts.load('200px "Pinyon Script"');if(!document.fonts.check('200px "Pinyon Script"'))return;const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createRadialGradient(90,67,10,90,90,134);g.addColorStop(0,'#5b4232');g.addColorStop(1,'#241a13');x.fillStyle=g;x.fillRect(0,0,180,180);x.strokeStyle='rgba(205,168,112,.45)';x.lineWidth=1.2;x.beginPath();if(x.roundRect)x.roundRect(11,11,158,158,26);else x.rect(11,11,158,158);x.stroke();const tg=x.createLinearGradient(0,63,0,113);tg.addColorStop(0,'#efd6a6');tg.addColorStop(1,'#bd8c55');x.fillStyle=tg;x.textAlign='center';x.font='40px "Pinyon Script", cursive';x.fillText('Cherub’s',90,103);x.fillStyle='rgba(225,195,145,.7)';x.font='600 8px Inter, sans-serif';x.fillText('O   S',90,127);const l=$('#touchIcon');if(l)l.href=c.toDataURL('image/png')}catch(e){}}
readHash();init();liveTouchIcon();
</script>
