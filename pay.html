<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pay via UPI</title>
<meta name="theme-color" content="#e9dfd0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 600px at 20% -10%,#efe6d8,transparent 65%),#e9dfd0;color:#3d2e22;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);background:#f1e8db;border:1px solid #d8c8b1;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(60,40,20,.12)}
.to{color:#806c58;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
h1{font-family:Fraunces,serif;font-size:26px;margin:4px 0 2px}
.amt{font-size:46px;font-weight:700;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.note{color:#806c58;font-size:15px;margin-bottom:18px}
.pay{display:block;background:#687f52;color:#fbf3e7;text-decoration:none;font-weight:700;font-size:18px;padding:16px;border-radius:14px}
.apps{color:#806c58;font-size:13px;margin:8px 0 18px}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:14px;margin:6px 0}
.or{color:#806c58;font-size:13px;margin:4px 0 8px}
.upi span{word-break:break-all;text-align:left}
.upi{display:flex;gap:8px;align-items:center;justify-content:center;background:#e5d8c6;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:600;word-break:break-all}
.upi button{white-space:nowrap;flex-shrink:0;border:0;background:#9a6238;color:#fbf3e7;font-weight:600;border-radius:9px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px}
.err{color:#a6523b}
.small{font-size:12px;color:#806c58;margin-top:16px}
</style>
</head>
<body>
<div class="card" id="c"></div>
<script>
const q=new URLSearchParams(location.search),pa=(q.get('pa')||'').trim(),pn=(q.get('pn')||'').trim(),am=(q.get('am')||'').trim(),tn=(q.get('tn')||'').trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c=document.getElementById('c');
if(!/^[\w.\-]{2,}@[\w]{2,}$/.test(pa)){c.innerHTML='<h1>Payment link</h1><p class="err">This payment link is incomplete. Please ask for a new one.</p>'}
else{
 const amt=Number(am)>0?Number(am).toFixed(2):'';
 const upi='upi://pay?'+['pa='+encodeURIComponent(pa),'pn='+encodeURIComponent(pn||pa),amt?'am='+amt:'','cu=INR',tn?'tn='+encodeURIComponent(tn.slice(0,60)):''].filter(Boolean).join('&');
 const rupees=amt?'₹'+Number(amt).toLocaleString('en-IN',{maximumFractionDigits:2}):'';
 c.innerHTML=`<div class="to">Pay to</div><h1>${esc(pn||pa)}</h1>${rupees?`<div class="amt">${rupees}</div>`:''}${tn?`<div class="note">${esc(tn)}</div>`:'<div style="height:12px"></div>'}
 <a class="pay" href="${esc(upi)}">Pay ${rupees||''} with UPI</a>
 <div class="apps">Opens Google Pay, PhonePe, Paytm or any UPI app</div>
 <div class="or">On a computer? Scan with your phone’s UPI app:</div><div id="qr"></div>
 <div class="upi"><span>${esc(pa)}</span><button id="cp">Copy UPI ID</button></div>
 <div class="small">The payment goes directly to ${esc(pn||pa)}’s bank account through UPI. Please check the name in your UPI app before paying.</div>`;
 try{new QRCode(document.getElementById('qr'),{text:upi,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}catch(e){document.getElementById('qr').remove();document.querySelector('.or').remove()}
 document.getElementById('cp').onclick=()=>{navigator.clipboard.writeText(pa).then(()=>{document.getElementById('cp').textContent='Copied ✓'}).catch(()=>{})};
}
</script>
</body>
</html>
