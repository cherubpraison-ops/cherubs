name: Cherub notifications

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: notifier
        run: npm install --no-audit --no-fund firebase-admin@12
      - name: Send due notifications
        run: node notifier/notify.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
